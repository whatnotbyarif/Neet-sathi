```html
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhruva Sir | NEET Saathi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5ff;color:#182044}
header{background:#101735;color:white;padding:20px}
header h2{margin:0;color:#a99aff}
header p{margin:8px 0 0;font-size:14px}
main{max-width:760px;margin:25px auto;padding:16px}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 20px #18204412}
.teacher{text-align:center;background:linear-gradient(135deg,#111936,#30216b);color:white}
.avatar{font-size:65px}
.teacher h1{margin:8px 0;color:#c0aaff}
.badge{display:inline-block;background:#164e45;color:#8ef0cf;padding:7px 12px;border-radius:20px;font-size:12px}
label{display:block;margin:20px 0 8px;font-weight:bold}
select,textarea{width:100%;padding:13px;border:1px solid #d9dcef;border-radius:10px;font-size:16px}
textarea{height:120px;resize:vertical}
button{border:0;border-radius:10px;background:#7350ed;color:white;padding:14px 18px;font-size:16px;font-weight:bold;width:100%;margin-top:12px}
#answer{display:none;margin-top:18px;background:#f0edff;padding:16px;border-radius:12px;line-height:1.6}
.small{font-size:13px;color:#6b7280;line-height:1.5}
a{color:#c0aaff}
</style>
</head>
<body>
<header>
  <h2>🎓 NEET Saathi</h2>
  <p><a href="index.html">← Home Page पर वापस जाएँ</a></p>
</header>

<main>
  <section class="card teacher">
    <div class="avatar">👨‍🏫</div>
    <h1>Dhruva Sir</h1>
    <p>आपके NEET के सभी विषयों के शिक्षक</p>
    <span class="badge">● Study Mode</span>
  </section>

  <section class="card" style="margin-top:18px">
    <h2>📚 आज क्या पढ़ना है?</h2>
    <p>अपना विषय चुनें और सवाल लिखें।</p>

    <label for="subject">विषय चुनें</label>
    <select id="subject">
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Biology</option>
    </select>

    <label for="question">अपना सवाल लिखें</label>
    <textarea id="question" placeholder="उदाहरण: न्यूटन का दूसरा नियम समझाइए..."></textarea>

    <button onclick="askQuestion()">सवाल सबमिट करें →</button>

    <div id="answer" role="status"></div>
    <p class="small">ध्यान दें: यह शुरुआती संस्करण है। असली AI उत्तर देने की सुविधा अभी कनेक्ट नहीं हुई है।</p>
  </section>
</main>

<script>
function askQuestion(){
  const q=document.getElementById('question').value.trim();
  const subject=document.getElementById('subject').value;
  const box=document.getElementById('answer');
  box.style.display='block';
  if(!q){
    box.textContent='कृपया पहले अपना सवाल लिखें।';
    return;
  }
  box.textContent='आपका '+subject+' का सवाल दर्ज हो गया है। Dhruva Sir से असली AI उत्तर पाने के लिए अगले चरण में AI कनेक्ट करेंगे।';
}
</script>
</body>
</html>
```
